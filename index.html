<script>
const S=localStorage,ld=k=>{try{return JSON.parse(S.getItem(k))}catch(e){return null}},sv=(k,v)=>{try{S.setItem(k,JSON.stringify(v))}catch(e){}};
let DB=ld('lm_tx')||[],V='h',RG=null,SL=0,EXP=null,PK={},DM=false,MSG='',CUR=ld('lm_cur')||'EUR',RATE=ld('lm_rate')||{UAH:48,USD:0.93};
const SYM={EUR:'€',UAH:'₴',USD:'$'};
const BK={raif:{n:'Райф картка',bg:'linear-gradient(135deg,#ffe600,#ffd400 60%,#f5c800)',tc:'#111',l:'Raiffeisen Bank',ic:'<svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20" stroke="currentColor" stroke-width="5" fill="none"/></svg>'},mono:{n:'Чорна картка',bg:'linear-gradient(135deg,#2a2a2a,#050505)',tc:'#fff',l:'monobank',ic:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>'},privat:{n:'Приват картка',bg:'linear-gradient(135deg,#5ecb3a,#237a17)',tc:'#fff',l:'Приват24',ic:'<svg viewBox="0 0 24 24"><path d="M4 13l5 5L20 6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'},revolut:{n:'Revolut картка',bg:'linear-gradient(135deg,#1c1c3c,#3a1a5c 55%,#0d0d20)',tc:'#fff',l:'Revolut',ic:'<svg viewBox="0 0 24 24"><path d="M6 4l10 8-10 8" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'}};
let CARDS=ld('lm_cards');if(!CARDS||!CARDS.length){CARDS=[{id:'c0',bk:'raif',cur:'EUR',last:'7682'}];sv('lm_cards',CARDS)}
let ACT=new Set(ld('lm_active')||CARDS.map(c=>c.id));
const cidOf=x=>x.cid||CARDS[0].id,inSel=x=>ACT.has(cidOf(x));
let NBK=null;
const MO=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'],MN=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const DEF=['Інше','⋯','#7a8ea0'],CT={'Продукти та супермаркети':['Продукти та супермаркети','🛒','#2fb673'],'Кафе та ресторани':['Кафе та ресторани','🍽️','#f08a24'],'Авіаквитки':['Подорожі','✈️','#1fb58f'],'Транспорт':['Транспорт','🚌','#5b7cfa'],'Краса та догляд':['Краса та догляд','💅','#d65db1'],'Спорт':['Спорт','🏋️','#e5534b'],'Кіно та театри':['Кіно та театри','🎬','#8b5cf6'],'Побутова техніка':['Техніка та зв’язок','📱','#3aa7d9'],'Інші витрати':DEF,'Комісії':['Комісії','%','#8f98a3'],'Поповнення':['Поповнення картки','⬇️','#2fb673'],'Обмін валюти':['Обмін валюти','💱','#c9a227'],'Грошові перекази':['На свої картки','💳','#e6399b']};
const kd=x=>x.c=='Обмін валюти'||x.c=='Грошові перекази'||/власними рахунками/.test(x.d)?'t':x.a>0?'i':'e';
const ci=x=>kd(x)=='t'&&x.c!='Обмін валюти'?CT['Грошові перекази']:CT[x.c]||DEF;
const f=n=>{const v=CUR=='EUR'?n:n*(RATE[CUR]||1);let[i,d]=Math.abs(v).toFixed(2).split('.');return(v<0?'-':'')+i.replace(/\B(?=(\d{3})+$)/g,'\u202f')+'.'+d+' '+SYM[CUR]};
const pl=n=>n%10==1&&n%100!=11?'транзакція':n%10>1&&n%10<5&&(n%100<10||n%100>20)?'транзакції':'транзакцій';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const dm=t=>+t.slice(8,10)+' '+MO[t.slice(5,7)-1].slice(0,3);
const srt=()=>DB.filter(inSel).slice().sort((a,b)=>b.t.localeCompare(a.t));
const num=s=>{const v=s.replace(/[\s\u00a0\u202f]/g,'');return/^-?\d+\.\d\d$/.test(v)?parseFloat(v):null};
async function parsePdf(buf){
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const pdf=await pdfjsLib.getDocument({data:buf}).promise,out=[];
 for(let p=1;p<=pdf.numPages;p++){
  const pg=await pdf.getPage(p),W=pg.view[2],tc=await pg.getTextContent();
  const its=tc.items.filter(i=>i.str.trim()).map(i=>({x:i.transform[4]/W,r:(i.transform[4]+i.width)/W,y:i.transform[5],s:i.str.trim()}));
  if(its.some(i=>i.s.startsWith('ІПН')))continue;
  const st=its.filter(i=>i.x<.11&&/^\d\d\.\d\d\.\d{4}$/.test(i.s)).sort((a,b)=>b.y-a.y);
  st.forEach((s,n)=>{
   const lo=n+1<st.length?st[n+1].y+6:-1e9,rw={d:[],e:[],t:[],m:[],a:[],o:[],f:[],c:[],b:[]};
   its.filter(i=>i.y<=s.y+4&&i.y>lo).sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{
    const k=i.x<.11?'d':i.x<.2?'e':i.x<.38?'t':i.x<.5?'m':i.r<.64?'a':i.r<.74?'o':i.r<.8?'f':i.r<.91?'c':'b';rw[k].push(i.s)});
   const tm=rw.d.find(v=>/^\d\d:\d\d:\d\d$/.test(v));if(!tm)return;
   const[dd,mm,yy]=s.s.split('.'),det=rw.t.join(' ').replace(/\s*Картка:.*$/,'').replace(/\s+/g,' ');
   const ix=det.indexOf(':'),a=rw.a.map(num).find(v=>v!==null);if(a==null)return;
   const cb=rw.c.map(num).find(v=>v!==null)||0,bal=num(rw.b.join('')),d=det.slice(ix+1).trim(),m=/FROM:([^,]+)/i.exec(det),ot=rw.o.join(' ');
   out.push({t:`${yy}-${mm}-${dd}T${tm}`,a,d,c:det.slice(0,ix).trim(),cb:a<0?cb:0,fee:a>0?cb:0,bal,o:/UAH|USD|PLN|GBP/.test(ot)?ot:'',snd:m?m[1].trim():'',pre:bal==null&&a>0&&!!m})})}
 return out}
const near=(a,b)=>Math.abs(new Date(a)-new Date(b))<1728e5;
function imp(list,bid,cid){
 let add=0,skip=0;const real=list.filter(x=>!x.pre);
 DB=DB.filter(r=>!(r.p&&real.some(x=>x.snd&&x.snd==r.snd&&near(x.t,r.t))));
 const have=new Set(DB.map(x=>x.k)),seen={};
 list.forEach(x=>{
  if(x.pre&&(real.some(r=>r.snd==x.snd&&near(r.t,x.t))||DB.some(r=>!r.p&&r.snd==x.snd&&near(r.t,x.t)))){skip++;return}
  const fp=[cid,x.t,x.a.toFixed(2),x.d,x.bal??''].join('|'),n=seen[fp]=(seen[fp]??-1)+1,k=fp+'#'+n;
  if(have.has(k)){skip++;return}
  DB.push({...x,k,b:bid,cid,p:x.pre||undefined});add++;
  if(x.fee)DB.push({k:k+'#fee',t:x.t,a:-x.fee,d:'Комісія за SWIFT',c:'Комісії',cb:0,cid,b:bid})});
 return[add,skip]}
const PRCAT={'Зарахування':'Поповнення','Зарахування зі своєї картки':'Грошові перекази','Переказ на свою картку':'Грошові перекази','Перекази':'Грошові перекази','Супермаркети та продукти':'Продукти та супермаркети','Ресторани, кафе, бари':'Кафе та ресторани','Краса':'Краса та догляд'};
async function parsePrivat(buf){
 const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
 const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
 const hdr=rows.findIndex(r=>r&&r[0]=='Дата');if(hdr<0)throw 0;
 const out=[];
 for(let i=hdr+1;i<rows.length;i++){const r=rows[i];if(!r||!r[0])continue;
  const m=/^(\d\d)\.(\d\d)\.(\d{4})\s+(\d\d:\d\d:\d\d)/.exec(String(r[0]));if(!m)continue;
  const a=parseFloat(r[4]);if(isNaN(a))continue;
  out.push({t:`${m[3]}-${m[2]}-${m[1]}T${m[4]}`,a,d:String(r[3]||''),c:PRCAT[String(r[1]||'')]||'Інше',cb:0,fee:0,bal:typeof r[8]=='number'?r[8]:null,o:'',snd:'',pre:false})}
 return out}
async function up(fl){
 if(ACT.size!=1){MSG='Оберіть рівно одну картку на головному екрані, потім завантажте виписку';R();return}
 const cid=[...ACT][0],card=CARDS.find(c=>c.id==cid);
 if(!card||!(card.bk=='raif'||card.bk=='privat')){MSG='Поки розпізнаються виписки тільки Райффайзен (PDF) і Приват24 (Excel). Для інших банків картка лише для відображення';R();return}
 const bid=Date.now();let A=0,K=0;
 const conv=card.cur=='EUR'?x=>x:x=>({...x,a:x.a/(RATE[card.cur]||1)});
 try{for(const fi of fl){
   const buf=await fi.arrayBuffer();
   const raw=(card.bk=='raif'?await parsePdf(buf):await parsePrivat(buf)).map(conv);
   const[a,k]=imp(raw,bid,cid);A+=a;K+=k}
  sv('lm_tx',DB);sv('lm_last',bid);RG=null;MSG=`Додано ${A}, пропущено ${K} (вже були)`}
 catch(e){MSG='Не вдалося прочитати файл. Перевірте формат виписки для цього банку.'}
 R()}
function undo(){const b=ld('lm_last');DB=DB.filter(x=>x.b!=b);sv('lm_tx',DB);S.removeItem('lm_last');MSG='Останнє завантаження скасовано';R()}
const rng=()=>{if(RG)return RG;const d=DB.filter(inSel).map(x=>x.t.slice(0,10)).sort();return{s:d[0],e:d[d.length-1]}};
const rlab=()=>{const{s,e}=rng();return s?`${+s.slice(8)} ${MO[s.slice(5,7)-1]} – ${+e.slice(8)} ${MO[e.slice(5,7)-1]} ${e.slice(0,4)}`:'Немає даних'};
function row(x){const[n,ic,co]=ci(x);return`<div class=r><i style="background:${co}33">${ic}</i><div class=m><b>${esc(x.d)}</b><s>${n} · ${dm(x.t)}, ${x.t.slice(11,16)}${x.p?' · очікується':''}</s></div><div class=am><b class="${x.a>0&&!x.p?'g':''}">${f(x.a)}</b>${x.cb?`<s>+${x.cb.toFixed(2)} € кешбек</s>`:''}</div></div>`}
const CD=[['Витрати','↗','#ff7a1a','e'],['На свої картки','💳','#f0359a','t'],['Надходження','↙','#22c55e','i'],['Кешбек','%','#e6b800','c']];
function agg(k){const{s,e}=rng(),m={};let tot=0,n=0;
 DB.filter(x=>!x.p&&inSel(x)&&x.t.slice(0,10)>=s&&x.t.slice(0,10)<=e).forEach(x=>{
  const K=kd(x);let v=0;if(k=='e'&&K=='e')v=x.a;else if(k=='t'&&K=='t')v=x.a;else if(k=='i'&&K=='i')v=x.a;else if(k=='c'&&K=='e'&&x.cb)v=x.cb;else return;
  const c=ci(x),o=m[c[0]]||(m[c[0]]={c,v:0,n:0,tx:[]});o.v+=v;o.n++;o.tx.push(x);tot+=v;n++});
 return{m:Object.values(m).sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)),tot,n}}
function lst(){const k=CD[SL][3],a=agg(k),T=a.m.reduce((s,o)=>s+Math.abs(o.v),0)||1;
 return a.m.map(o=>`<div class=cg><button class="r rb" onclick="tgl('${o.c[0].replace(/'/g,"\\'")}')"><i style="background:${o.c[2]}44">${o.c[1]}</i><div class=m><b>${o.c[0]}</b><s>${o.n} ${pl(o.n)}</s></div><div class=am><b class="${o.v>0?'g':''}">${f(o.v)}</b><s>${Math.round(Math.abs(o.v)/T*100)}%</s></div></button>${EXP==o.c[0]?`<div class=sub>${o.tx.slice().sort((a,b)=>b.t.localeCompare(a.t)).map(row).join('')}</div>`:''}</div>`).join('')||'<div class=em>Немає даних за період</div>'}
function tgl(n){EXP=EXP==n?null:n;$('#ls').innerHTML=lst()}
function sc(el){const i=Math.round(el.scrollLeft/(el.firstChild.offsetWidth+12));if(i!=SL){SL=i;EXP=null;$('#ls').innerHTML=lst();$('#dt').innerHTML=CD.map((_,j)=>`<u class="${j==SL?'on':''}"></u>`).join('')}}
const $=s=>document.querySelector(s);
const LOGO='<div class=lg><svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20" stroke="#111" stroke-width="5" fill="none"/></svg>Raiffeisen Bank</div>';
function R(){
 const a=$('#app'),l=srt(),last=ld('lm_last'),due=last&&Date.now()-last>30*864e5&&!DM;let h='';
 const bar=(t,b)=>`<div class=top><button class=ib onclick="go('h')" aria-label="Назад">←</button><b style="font-size:18px">${t}</b><span style="display:flex;align-items:center"><button class=ib onclick="cyc()" aria-label="Валюта" style="font-size:15px;font-weight:700">${SYM[CUR]}</button><button class=ib onclick="th()" aria-label="Тема">◐</button></span></div>`;
 if(V=='h'){
  h=`<div class=top><span></span><span style="display:flex;align-items:center"><button class=ib onclick="cyc()" aria-label="Валюта" style="font-size:15px;font-weight:700">${SYM[CUR]}</button><button class=ib onclick="th()" aria-label="Тема">◐</button><button class=ib onclick="go('s')" aria-label="Аналітика"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="9" cy="6" rx="6" ry="2.5"/><path d="M3 6v5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V6M3 11v5c0 1.4 2.7 2.5 6 2.5"/><ellipse cx="16" cy="15" rx="5" ry="2"/><path d="M11 15v4c0 1.1 2.2 2 5 2s5-.9 5-2v-4"/></svg></button></span></div>`;
  if(due)h+=`<button class=pill onclick="DM=true;R()"><b>Час оновити аналітику.</b> Завантажте, будь ласка, виписку за місяць.</button>`;
  if(MSG)h+=`<div class=pill>${MSG}</div>`;
  h+=`<div class=cwrap id=cw ontouchstart="tS(event)" ontouchmove="tM(event)" ontouchend="tE(event)">${cardHTML()}</div>${CARDS.length>1?`<div class=dots id=dots>${CARDS.map((_,j)=>`<u class="${j==CI?'on':''}"></u>`).join('')}</div>`:''}<button class="pill actv" onclick="listSheet()">${CARDS.length>1?'Усі картки':CARDS[CI].bk?BK[CARDS[CI].bk].n:'Усі картки'} ›</button><div class=qrow><div><button onclick="NBK=null;cardSheet()">＋</button><span>Додати<br>картку</span></div>${CARDS.length>1?`<div><button onclick="delCard()">🗑</button><span>Видалити<br>картку</span></div>`:''}</div>${opsHTML()}${last?`<button class=lk onclick="undo()">Скасувати останнє завантаження</button>`:''}<label class=fab><input type=file accept="${CARDS[CI].bk=='privat'?'.xlsx':'.pdf'}" multiple hidden onchange="up(this.files);this.value=''">＋ Завантажити виписку</label>`}
 else if(V=='a'){let d='';h=bar('Усі операції')+'<div class=tick></div>'+l.map(x=>{const k=x.t.slice(0,10),t=k!=d?`<div class=dh>${+k.slice(8)} ${MO[k.slice(5,7)-1]}</div>`:'';d=k;return t+row(x)}).join('')}
 else{h=`<div class=top><button class=ib onclick="go('h')" aria-label="Назад">←</button><span style="display:flex;align-items:center"><button class=ib onclick="cyc()" aria-label="Валюта" style="font-size:15px;font-weight:700">${SYM[CUR]}</button><button class=ib onclick="th()" aria-label="Тема">◐</button></span></div><div class=bk>Статистика</div><div style="display:flex;align-items:center;gap:10px;color:var(--t2)">${rlab()}<button class=ib onclick="opc()" aria-label="Календар" style="width:34px;height:34px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5"/></svg></button></div><div class=tick></div><div class=car onscroll="sc(this)">${CD.map(c=>{const a=agg(c[3]),v=c[3]=='e'?-a.tot:a.tot,dn=rng().s?Math.round((new Date(rng().e)-new Date(rng().s))/864e5)+1:0;return`<div class=cd><div class=ci style="background:${c[2]}">${c[1]}</div><p>${c[0]}</p><h2>${f(c[3]=='i'||c[3]=='c'?Math.abs(v):v)}</h2><div class=bx>Усього ${a.n} ${pl(a.n)}</div><div class=tl><div class=bx><b>${a.m.length}</b><span>Категорій</span></div><div class=bx><b>${dn}</b><span>Днів</span></div></div></div>`}).join('')}</div><div class=dots id=dt>${CD.map((_,j)=>`<u class="${j==SL?'on':''}"></u>`).join('')}</div><div class=hd style="margin-top:8px"><b>Категорії</b></div><div id=ls>${lst()}</div>`}
 a.innerHTML=h}
function opsHTML(){const l=srt();return`<div class=gl id=ops><div class=hd><b>Операції</b>${l.length>3?`<button class=all onclick="go('a')">Усі ›</button>`:''}</div>${l.slice(0,3).map(row).join('')||'<div class=em>Завантажте виписку, щоб побачити операції</div>'}</div>`}
function cardHTML(){const c=CARDS[CI]||CARDS[0],bk=BK[c.bk];return`<div class=card style="background:${bk.bg};color:${bk.tc}"><div class=lg style="color:${bk.tc}">${bk.ic}${bk.l}</div><div><b>${bk.n}</b><br><span>${c.cur}${c.last?' · •••• '+c.last:''}</span></div></div>`}
let CI=(()=>{if(ACT.size==1){const id=[...ACT][0],i=CARDS.findIndex(c=>c.id==id);return i>=0?i:0}return 0})(),TX=0;
function tS(e){TX=e.touches[0].clientX;const c=$('#cw').querySelector('.card');if(c)c.style.transition='none'}
function tM(e){const dx=e.touches[0].clientX-TX,c=$('#cw').querySelector('.card');if(c)c.style.transform=`perspective(220vw) rotateX(9deg) translateX(${dx*.6}px)`}
function tE(e){const dx=e.changedTouches[0].clientX-TX,c=$('#cw').querySelector('.card');if(c){c.style.transition='transform .15s';c.style.transform=''}
 if(Math.abs(dx)<40)return;if(dx<0&&CI<CARDS.length-1)CI++;else if(dx>0&&CI>0)CI--;else return;setCI()}
function setCI(){const c=CARDS[CI];ACT=new Set([c.id]);sv('lm_active',[c.id]);RG=null;$('#cw').innerHTML=cardHTML();const d=$('#dots');if(d)d.innerHTML=CARDS.map((_,j)=>`<u class="${j==CI?'on':''}"></u>`).join('');const o=$('#ops');if(o)o.outerHTML=opsHTML()}
function listSheet(){$('#ov').innerHTML=`<div class=ov onclick="if(event.target==this)$('#ov').innerHTML=''"><div class=sheet><b style="font-size:19px">Усі картки</b><div style="margin-top:10px">${CARDS.map((c,i)=>{const bk=BK[c.bk];return`<button class="r rb" onclick="CI=${i};setCI();$('#ov').innerHTML=''"><i style="background:${bk.bg}"></i><div class=m><b>${bk.n}</b><s>${c.cur}${c.last?' · •••• '+c.last:''}</s></div></button>`}).join('')}</div></div></div>`}
function delCard(){if(CARDS.length<=1)return;
 if(!confirm('Видалити картку разом з усією аналітикою по ній?'))return;
 const id=CARDS[CI].id,fb=CARDS[0].id;
 DB=DB.filter(x=>(x.cid||fb)!=id);sv('lm_tx',DB);
 CARDS=CARDS.filter(c=>c.id!=id);sv('lm_cards',CARDS);
 CI=Math.min(CI,CARDS.length-1);
 ACT=new Set([CARDS[CI].id]);sv('lm_active',[CARDS[CI].id]);RG=null;R()}
function go(v){V=v;MSG='';SL=0;EXP=null;$('#scroll').scrollTop=0;R()}
function toggleCard(id){if(ACT.has(id)){if(ACT.size>1)ACT.delete(id)}else ACT.add(id);sv('lm_active',[...ACT]);RG=null;R()}
function cardSheet(){const banks=[['raif','Райф'],['mono','monobank'],['privat','Приват24'],['revolut','Revolut']];
 if(!NBK){$('#ov').innerHTML=`<div class=ov onclick="if(event.target==this){$('#ov').innerHTML='';NBK=null}"><div class=sheet><b style="font-size:19px">Новий банк</b><div style="margin-top:10px">${banks.map(b=>`<button class="r rb" onclick="NBK='${b[0]}';cardSheet()"><i style="background:${BK[b[0]].bg}"></i><div class=m><b>${b[1]}</b></div></button>`).join('')}</div></div></div>`}
 else{$('#ov').innerHTML=`<div class=ov onclick="if(event.target==this){$('#ov').innerHTML='';NBK=null}"><div class=sheet><b style="font-size:19px">Валюта картки</b><div style="margin-top:12px;display:flex;gap:10px">${['EUR','UAH','USD'].map(c=>`<button class=pill style="flex:1;text-align:center" onclick="addCard('${NBK}','${c}')">${SYM[c]} ${c}</button>`).join('')}</div></div></div>`}}
function addCard(bk,cur){const id='c'+Date.now();CARDS.push({id,bk,cur});sv('lm_cards',CARDS);ACT=new Set([id]);sv('lm_active',[id]);CI=CARDS.length-1;NBK=null;$('#ov').innerHTML='';R()}
function th(){const c=document.documentElement,dk=c.dataset.theme?c.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;c.dataset.theme=dk?'light':'dark';try{S.setItem('lm_th',c.dataset.theme)}catch(e){}}
function cyc(){const o=['EUR','UAH','USD'];CUR=o[(o.indexOf(CUR)+1)%3];sv('lm_cur',CUR);const fresh=Date.now()-(+ld('lm_rate_ts')||0)<864e5;if(CUR!='EUR'&&!fresh){const nv=prompt(`Курс 1 EUR = ? ${SYM[CUR]} (не вдалося отримати автоматично, введіть курс)`,RATE[CUR]);if(nv&&!isNaN(parseFloat(nv)))RATE[CUR]=parseFloat(nv);sv('lm_rate',RATE)}R()}
async function fetchRate(){
 try{const r=await fetch('https://api.frankfurter.app/latest?from=EUR&to=UAH,USD');if(!r.ok)throw 0;const j=await r.json();
  if(j.rates&&j.rates.UAH&&j.rates.USD){RATE={UAH:j.rates.UAH,USD:j.rates.USD};sv('lm_rate',RATE);sv('lm_rate_ts',Date.now());R()}}
 catch(e){}}
function opc(){const ds=DB.filter(inSel).map(x=>x.t.slice(0,10)).sort();if(!ds.length)return;const r=rng();PK={s:r.s,e:r.e};
 const[ya,ma]=ds[0].split('-').map(Number),[yb,mb]=ds[ds.length-1].split('-').map(Number),n=(yb-ya)*12+mb-ma;let h='';
 for(let i=0;i<=n;i++){const d=new Date(ya,ma-1+i,1),y=d.getFullYear(),m=d.getMonth(),fs=(d.getDay()+6)%7,nd=new Date(y,m+1,0).getDate();
  h+=`<div class=mn>${MN[m]} ${y}</div><div class=gr>${'<span></span>'.repeat(fs)}${Array.from({length:nd},(_,k)=>`<b data-d="${y}-${String(m+1).padStart(2,'0')}-${String(k+1).padStart(2,'0')}">${k+1}</b>`).join('')}</div>`}
 $('#ov').innerHTML=`<div class=ov onclick="if(event.target==this)$('#ov').innerHTML=''"><div class=sheet><b style="font-size:19px">Період</b><div style="color:var(--t2);font-size:14px;margin:2px 0 10px" id=pl></div><div class=wd><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>нд</span></div>${h}</div><button class=go onclick="RG={s:PK.s,e:PK.e||PK.s};$('#ov').innerHTML='';SL=0;R()">Показати</button></div>`;
 document.querySelectorAll('.gr b').forEach(c=>c.onclick=()=>{const d=c.dataset.d;if(!PK.s||PK.e){PK={s:d}}else{PK.e=d;if(PK.e<PK.s)[PK.s,PK.e]=[PK.e,PK.s]}pt()});pt()}
function pt(){document.querySelectorAll('.gr b').forEach(c=>{const d=c.dataset.d;c.classList.toggle('on',d>=PK.s&&d<=(PK.e||PK.s))});$('#pl').textContent=PK.s?`${+PK.s.slice(8)} ${MO[PK.s.slice(5,7)-1]} – ${+(PK.e||PK.s).slice(8)} ${MO[(PK.e||PK.s).slice(5,7)-1]}`:''}
try{const t=S.getItem('lm_th');if(t)document.documentElement.dataset.theme=t}catch(e){}
R();
if(Date.now()-(+ld('lm_rate_ts')||0)>36e5)fetchRate();
</script></body></html>
